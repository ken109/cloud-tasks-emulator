version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - misspell
    - nilerr
    - revive
    - unconvert
    - usetesting
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
    rules:
      # Test helpers close over *testing.T and report failures there; a
      # dropped error in a fixture is not worth the noise.
      - path: _test\.go$
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
