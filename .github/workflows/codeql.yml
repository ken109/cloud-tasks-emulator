name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published query still finds an idle repository.
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - uses: github/codeql-action/init@v4.37.4
        with:
          languages: go
          queries: security-and-quality
      - uses: github/codeql-action/autobuild@v4.37.4
      - uses: github/codeql-action/analyze@v4.37.4
